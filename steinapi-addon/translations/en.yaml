{
  "configuration": {
    "divera_access_key": {
      "name": "Divera Access Key",
      "description": "The API Access Key from Divera24-7 (found under Management → Interfaces → API Access)"
    },
    "divera_base_url": {
      "name": "Divera API URL",
      "description": "The base URL of the Divera API (default: https://app.divera247.com/api/v2)"
    },
    "stein_api_key": {
      "name": "Stein.app API Key",
      "description": "The API Key from Stein.app"
    },
    "stein_business_unit_id": {
      "name": "Stein Business Unit ID",
      "description": "The Business Unit ID from Stein.app"
    },
    "stein_base_url": {
      "name": "Stein.app API URL",
      "description": "The base URL of the Stein.app API (default: https://www.stein.app/api, https only)"
    },
    "sync_interval_minutes": {
      "name": "Sync Interval (Minutes)",
      "description": "How often should automatic synchronization occur? (1-60 minutes)"
    },
    "sync_direction": {
      "name": "Sync Direction",
      "description": "In which direction should data be synchronized?"
    },
    "auto_sync_enabled": {
      "name": "Enable Auto-Sync",
      "description": "Should automatic synchronization be enabled?"
    },
    "timezone": {
      "name": "Timezone",
      "description": "Timezone for the container (e.g. Europe/Berlin, Europe/London, America/New_York)"
    },
    "log_level": {
      "name": "Log Level",
      "description": "Level of detail for logging (debug, info, warning, error)"
    },
    "max_log_entries": {
      "name": "Max Log Entries",
      "description": "Maximum number of log entries to store"
    },
    "rate_limit_requests": {
      "name": "Rate Limit (Requests)",
      "description": "Maximum number of API requests per time window"
    },
    "rate_limit_window_seconds": {
      "name": "Rate Limit Window (Seconds)",
      "description": "Time window for rate limiting"
    },
    "debug_endpoints": {
      "name": "Enable debug endpoints",
      "description": "Enables the debug endpoints (debug, compareData, rawDivera, rawStein, testSteinRaw). They expose raw data of both APIs without authentication - enable only temporarily for troubleshooting!"
    },
    "allow_direct_access": {
      "name": "Allow direct access to port 8099",
      "description": "Off: the dashboard is reachable only through the Home Assistant sidebar (Ingress); other add-ons and a published port get HTTP 403. On: anyone who can reach the port can use the API without authentication - enable only on a trusted network."
    }
  }
}
