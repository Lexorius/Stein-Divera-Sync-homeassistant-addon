; Alle Dienste schreiben in die Ausgabe des Containers (stdout/stderr) statt in
; Dateien unter /var/log. Nur so erscheinen ihre Meldungen im Protokoll-Reiter
; des Add-ons in Home Assistant bzw. in "docker logs". Dateien im Container
; sieht dort niemand, und sie gehen beim Neustart verloren.
; maxbytes=0 schaltet die Rotation ab, die auf /dev/stdout nicht möglich ist.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

; MariaDB schreibt ihr eigenes Fehlerprotokoll weiterhin nach /data/mysql/*.err
[program:mariadb]
command=/usr/local/bin/steinapi-mariadb.sh
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
user=mysql

[program:php-fpm]
command=/usr/sbin/php-fpm -F
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cron]
command=/usr/local/bin/steinapi-cron.sh
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
