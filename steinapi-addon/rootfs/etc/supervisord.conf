[supervisord]
nodaemon=true
logfile=/var/log/supervisord/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

[program:mariadb]
command=/usr/bin/mysqld_safe --datadir=/data/mysql
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisord/mariadb.log
stderr_logfile=/var/log/supervisord/mariadb-error.log
user=mysql

[program:php-fpm]
command=/usr/sbin/php-fpm83 -F
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisord/php-fpm.log
stderr_logfile=/var/log/supervisord/php-fpm-error.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisord/nginx.log
stderr_logfile=/var/log/supervisord/nginx-error.log

[program:cron]
command=/usr/local/bin/steinapi-cron.sh
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/supervisord/cron.log
stderr_logfile=/var/log/supervisord/cron-error.log
