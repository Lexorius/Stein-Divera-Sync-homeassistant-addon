; SteinAPI - PHP-Härtung
; Wird nach der Alpine-Standard-php.ini geladen und überschreibt deren Werte.
;
; Hintergrund: php.net Security Advisory vom 21.10.2026
;   CVE-2026-109618 - RCE über OOM-Korruption beim Multipart-Parsing
;   CVE-2026-109619 - RCE über veralteten globalen Zustand (u.a. session.upload_progress)
; Die eigentliche Behebung ist PHP >= 8.4.27 (wird im Dockerfile erzwungen).
; Die folgenden Einstellungen entfernen die Angriffsvektoren zusätzlich komplett,
; da die API ausschließlich JSON aus php://input und GET-Parameter liest.

; --- Informationspreisgabe ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
html_errors = Off

; --- Request-Parsing ---
; Deaktiviert das Befüllen von $_POST/$_FILES und damit den Multipart-Parser.
; php://input bleibt weiterhin lesbar (einziger Weg, den die API nutzt).
enable_post_data_reading = Off
file_uploads = Off
max_file_uploads = 0
upload_max_filesize = 0
post_max_size = 1M
max_input_vars = 100
max_input_nesting_level = 8
max_input_time = 30

; --- Ressourcen ---
memory_limit = 128M
; Sync-Läufe können wegen des Stein.app-Rate-Limits (3 s/Anfrage) länger dauern
max_execution_time = 300

; --- Sessions (werden von der App nicht genutzt, trotzdem absichern) ---
session.upload_progress.enabled = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict

; --- Remote-Dateizugriff ---
allow_url_fopen = Off
allow_url_include = Off

; --- Zeitzone (wird von api.php aus der Konfiguration überschrieben) ---
date.timezone = UTC
