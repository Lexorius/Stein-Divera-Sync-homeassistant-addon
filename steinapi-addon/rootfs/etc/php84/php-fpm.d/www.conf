; SteinAPI - php-fpm Pool-Konfiguration
; Ersetzt die Alpine-Standarddatei /etc/php84/php-fpm.d/www.conf vollständig.

; Meldungen von php-fpm in die Ausgabe des Containers statt in eine Datei unter
; /var/log, damit sie im Add-on-Protokoll erscheinen. Fehler aus PHP selbst
; kommen über FastCGI beim Webserver an und stehen dort im Fehlerprotokoll.
[global]
error_log = /proc/self/fd/2

[www]
user = nginx
group = nginx

listen = /run/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Worker regelmäßig neu starten - begrenzt die Lebensdauer von Prozesszustand
pm.max_requests = 500

; Entspricht fastcgi_read_timeout in nginx.conf
request_terminate_timeout = 300s

; Umgebungsvariablen NICHT an PHP durchreichen. Im Standalone-Container
; stehen dort die API-Keys; die App liest ausschließlich config.php.
clear_env = yes

; Offizielle Zwischenlösung für CVE-2026-129291 (GHSA-jm4m-qfqx-967m, Use-after-free
; in der epoll-Behandlung von php-fpm, behoben in 8.4.28): Die Lücke setzt
; catch_workers_output = yes voraus. Auch mit gepatchtem PHP bleibt es aus.
catch_workers_output = no

php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_flag[expose_php] = off
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[enable_post_data_reading] = off
php_admin_flag[file_uploads] = off
