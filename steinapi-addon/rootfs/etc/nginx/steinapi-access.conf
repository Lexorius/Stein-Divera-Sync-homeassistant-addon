# SteinAPI - Zugriffsbeschränkung für den Webserver
# Standardwert; wird beim Start von steinapi-init.sh aus der Option
# allow_direct_access neu geschrieben.
#
# Die API hat keine eigene Anmeldung. Im Add-on übernimmt Home Assistant die
# Anmeldung über Ingress. Ingress-Anfragen kommen immer vom Supervisor
# (172.30.32.2). Ohne diese Regeln könnte jedes andere Add-on auf demselben
# Gerät die API im internen Netz direkt und ohne Anmeldung aufrufen.
allow 127.0.0.1;
allow ::1;
allow 172.30.32.2;
deny all;
