worker_processes auto;
# Fehler in die Ausgabe des Containers, damit sie im Add-on-Protokoll erscheinen
# (z. B. "access forbidden by rule" bei abgelehnten Anfragen).
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Kein Zugriffsprotokoll: Dashboard, Cron und Watchdog fragen im
    # Sekunden- bis Minutentakt an. Als Datei wüchse es ohne Grenze, in der
    # Container-Ausgabe verdrängte es die Meldungen, auf die es ankommt.
    access_log off;

    sendfile on;
    keepalive_timeout 65;

    # Keine nginx-Version in Headern und Fehlerseiten preisgeben
    server_tokens off;

    # Die API verarbeitet nur kleine JSON-Bodies
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Rate-Limit-Zone (wird von steinapi-init.sh aus der Konfiguration erzeugt)
    include /etc/nginx/steinapi-ratelimit.conf;
    limit_req_status 429;

    server {
        listen 8099 default_server;
        server_name _;

        # Zugriffsbeschränkung (allow/deny), erzeugt von steinapi-init.sh:
        # im Add-on nur Home Assistant Ingress und localhost, es sei denn,
        # die Option allow_direct_access ist gesetzt.
        include /etc/nginx/steinapi-access.conf;

        root /var/www/html;
        index index.html;

        # Sicherheits-Header (kein X-Frame-Options: HA Ingress bettet die Seite per iframe ein)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        # ------------------------------------------------------------------
        # Gesperrte Pfade - zuerst, damit sie Vorrang vor allen Regex-Locations haben
        # ------------------------------------------------------------------
        location ^~ /config/ {
            return 404;
        }

        location ^~ /src/ {
            return 404;
        }

        location = /install.sql {
            return 404;
        }

        # Versteckte Dateien (.htaccess, .git, ...)
        location ~ /\. {
            return 404;
        }

        # ------------------------------------------------------------------
        # API Endpoint - einzige PHP-Datei, die ausgeführt wird
        # ------------------------------------------------------------------
        location = /api.php {
            limit_req zone=steinapi_api burst=50 nodelay;

            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/api.php;
            include fastcgi_params;

            # Verbindung zu php-fpm nach jeder Anfrage schließen. Das ist die
            # Voreinstellung und die offizielle Zwischenlösung für CVE-2026-129289
            # (GHSA-qc49-hpvq-g2w6, Request-Smuggling in php-fpm). Nicht auf "on" stellen.
            fastcgi_keep_conn off;

            # Timeout für lange Operationen (Sync mit Stein.app-Rate-Limit)
            fastcgi_read_timeout 300;

            # Große Antworten (z. B. 500 Protokolleinträge) nicht in eine
            # temporäre Datei auslagern. Das erzeugte je Abruf eine Warnzeile
            # im Protokoll des Add-ons.
            fastcgi_max_temp_file_size 0;

            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
        }

        # Alle anderen PHP-Dateien werden NICHT ausgeführt
        location ~ \.php$ {
            return 404;
        }

        # ------------------------------------------------------------------
        # Dashboard: eine einzige Datei ohne externe Skripte, Styles oder Bilder.
        # Die API-URL bildet das Dashboard selbst relativ zum Ingress-Pfad.
        # ------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html?$args;
        }

        # Health check endpoint (ohne PHP)
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }
    }
}
