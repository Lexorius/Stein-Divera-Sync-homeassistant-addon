worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Ingress Header Support
    map $http_x_ingress_path $ingress_prefix {
        default "";
        ~^(?<prefix>.+)$ $prefix;
    }

    server {
        listen 8099 default_server;
        server_name _;

        root /var/www/html;
        index index.php index.html;

        # Ingress base path handling
        set $base "";
        if ($http_x_ingress_path != "") {
            set $base $http_x_ingress_path;
        }

        location / {
            try_files $uri $uri/ /index.html?$args;
            
            # Für Ingress: Füge Base-Path zu relativen URLs hinzu
            sub_filter_once off;
            sub_filter_types text/html text/css application/javascript;
            sub_filter 'href="/' 'href="$base/';
            sub_filter 'src="/' 'src="$base/';
            sub_filter 'url(/' 'url($base/';
            sub_filter 'action="/' 'action="$base/';
        }

        # PHP Handling
        location ~ \.php$ {
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param INGRESS_PATH $http_x_ingress_path;
            include fastcgi_params;
            
            # Timeout für lange Operationen
            fastcgi_read_timeout 300;
        }

        # API Endpoint
        location /api.php {
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/api.php;
            fastcgi_param INGRESS_PATH $http_x_ingress_path;
            include fastcgi_params;
            fastcgi_read_timeout 300;
        }

        # Static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # Security: Block access to sensitive files
        location ~ /\.(ht|git) {
            deny all;
        }

        location ~ /config/ {
            deny all;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}
