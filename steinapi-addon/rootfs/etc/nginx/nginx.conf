worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Keine nginx-Version in Headern und Fehlerseiten preisgeben
    server_tokens off;

    # Die API verarbeitet nur kleine JSON-Bodies
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Rate-Limit-Zone (wird von steinapi-init.sh aus der Konfiguration erzeugt)
    include /etc/nginx/steinapi-ratelimit.conf;
    limit_req_status 429;

    # Ingress Header Support
    map $http_x_ingress_path $ingress_prefix {
        default "";
        ~^(?<prefix>.+)$ $prefix;
    }

    server {
        listen 8099 default_server;
        server_name _;

        root /var/www/html;
        index index.html;

        # Sicherheits-Header (kein X-Frame-Options: HA Ingress bettet die Seite per iframe ein)
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        # Ingress base path handling
        set $base "";
        if ($http_x_ingress_path != "") {
            set $base $http_x_ingress_path;
        }

        # ------------------------------------------------------------------
        # Gesperrte Pfade - zuerst, damit sie Vorrang vor allen Regex-Locations haben
        # ------------------------------------------------------------------
        location ^~ /config/ {
            return 404;
        }

        location ^~ /src/ {
            return 404;
        }

        location = /install.sql {
            return 404;
        }

        # Versteckte Dateien (.htaccess, .git, ...)
        location ~ /\. {
            return 404;
        }

        # ------------------------------------------------------------------
        # API Endpoint - einzige PHP-Datei, die ausgeführt wird
        # ------------------------------------------------------------------
        location = /api.php {
            limit_req zone=steinapi_api burst=50 nodelay;

            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/api.php;
            fastcgi_param INGRESS_PATH $http_x_ingress_path;
            include fastcgi_params;

            # Timeout für lange Operationen (Sync mit Stein.app-Rate-Limit)
            fastcgi_read_timeout 300;

            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
        }

        # Alle anderen PHP-Dateien werden NICHT ausgeführt
        location ~ \.php$ {
            return 404;
        }

        # ------------------------------------------------------------------
        # Dashboard / statische Dateien
        # ------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html?$args;

            # Für Ingress: Füge Base-Path zu relativen URLs hinzu
            sub_filter_once off;
            sub_filter_types text/css application/javascript;
            sub_filter 'href="/' 'href="$base/';
            sub_filter 'src="/' 'src="$base/';
            sub_filter 'url(/' 'url($base/';
            sub_filter 'action="/' 'action="$base/';
        }

        # Static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Health check endpoint (ohne PHP)
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK";
        }
    }
}
