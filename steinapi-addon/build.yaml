build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.19
  amd64: ghcr.io/home-assistant/amd64-base:3.19
  armhf: ghcr.io/home-assistant/armhf-base:3.19
  armv7: ghcr.io/home-assistant/armv7-base:3.19
  i386: ghcr.io/home-assistant/i386-base:3.19

labels:
  org.opencontainers.image.title: "SteinAPI"
  org.opencontainers.image.description: "Synchronization between Divera24-7 and Stein.app"
  org.opencontainers.image.source: "https://github.com/Lexorius/steinapi"
  org.opencontainers.image.licenses: "MIT"

args:
  BUILD_ARCH: ${BUILD_ARCH}
  BUILD_DATE: ${BUILD_DATE}
