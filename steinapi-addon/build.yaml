# Alpine 3.24 liefert PHP 8.4.27 mit den Fixes für CVE-2026-109618 / CVE-2026-109619.
# Home Assistant stellt Basis-Images nur noch für amd64 und aarch64 bereit;
# armhf, armv7 und i386 werden von HA nicht mehr unterstützt.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.24
  amd64: ghcr.io/home-assistant/amd64-base:3.24

labels:
  org.opencontainers.image.title: "SteinAPI"
  org.opencontainers.image.description: "Synchronization between Divera24-7 and Stein.app"
  org.opencontainers.image.source: "https://github.com/Lexorius/Stein-Divera-Sync-homeassistant-addon"
  org.opencontainers.image.licenses: "MIT"

args:
  BUILD_ARCH: ${BUILD_ARCH}
  BUILD_DATE: ${BUILD_DATE}
  BUILD_DESCRIPTION: "Synchronization between Divera24-7 and Stein.app"
  BUILD_NAME: "SteinAPI"
  BUILD_REF: ${BUILD_REF}
  BUILD_REPOSITORY: ${BUILD_REPOSITORY}
  BUILD_VERSION: ${BUILD_VERSION}
