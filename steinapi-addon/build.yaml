# Alpine 3.24 liefert PHP 8.4 aus dem community-Repository. Die Mindestversion erzwingt das Dockerfile.
# Home Assistant stellt Basis-Images nur noch für amd64 und aarch64 bereit;
# armhf, armv7 und i386 werden von HA nicht mehr unterstützt.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.24
  amd64: ghcr.io/home-assistant/amd64-base:3.24

labels:
  org.opencontainers.image.title: "SteinAPI"
  org.opencontainers.image.description: "Synchronization between Divera24-7 and Stein.app"
  org.opencontainers.image.source: "https://github.com/Lexorius/Stein-Divera-Sync-homeassistant-addon"
  org.opencontainers.image.licenses: "MIT"

# Nur feste Werte. BUILD_FROM, BUILD_ARCH und BUILD_VERSION setzt der Supervisor
# selbst. Einträge hier überschreiben ihn und werden NICHT ersetzt: Bis 2.2.4
# stand hier BUILD_VERSION mit einem Platzhalter in Dollar-Klammer-Schreibweise,
# und das Add-on meldete beim Start wörtlich diesen Platzhalter als Version.
# Der Testlauf lehnt deshalb jede solche Schreibweise in dieser Datei ab.
args:
  BUILD_DESCRIPTION: "Synchronization between Divera24-7 and Stein.app"
  BUILD_NAME: "SteinAPI"
