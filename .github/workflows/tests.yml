name: Tests

on:
  push:
  pull_request:

jobs:
  sync-logic:
    name: Syntax und Sync-Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP-Version
        run: php -v

      - name: PHP-Syntax
        run: find steinapi-addon/rootfs/var/www/html tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Shell-Syntax
        run: |
          for f in steinapi-addon/rootfs/usr/local/bin/*.sh steinapi-addon/rootfs/etc/services.d/steinapi/*; do
            bash -n "$f"
          done

      - name: Übersetzungen sind gültiges JSON
        run: jq empty steinapi-addon/translations/*.yaml

      # Der Supervisor ersetzt in build.yaml nichts. Ein Eintrag wie
      # "BUILD_VERSION: ${BUILD_VERSION}" überschreibt den echten Wert mit dem
      # Platzhalter (so geschehen bis 2.2.4).
      - name: build.yaml enthält keine Platzhalter
        run: |
          if grep -n '\${' steinapi-addon/build.yaml; then
            echo "build.yaml darf keine \${...}-Platzhalter enthalten"
            exit 1
          fi

      # Die Voreinstellung der Stein-Adresse steht an mehreren Stellen (Add-on,
      # Init-Skript, Container-Start, .env-Vorlage, Doku, Übersetzungen). Bis
      # 2.2.5 stand dort eine Adresse, die nicht die funktionierende war.
      # Der Changelog ist ausgenommen: er nennt die frühere Adresse als Historie.
      - name: Stein-Adresse ist überall dieselbe
        run: |
          grep -rhoE --exclude=CHANGELOG.md 'https://[a-z.]*stein\.app/[a-z/]*' steinapi-addon steinapi-docker | sort | uniq -c
          test "$(grep -rhoE --exclude=CHANGELOG.md 'https://[a-z.]*stein\.app/[a-z/]*' steinapi-addon steinapi-docker | sort -u)" = "https://stein.app/api/api/ext"

      - name: Sync-Simulation
        run: php tests/sync_simulation.php

  # Standalone-Container: Stufe "standalone" des gemeinsamen Dockerfiles.
  standalone:
    name: Standalone-Image bauen und starten
    runs-on: ubuntu-latest
    env:
      API: http://127.0.0.1:8099/api.php
    steps:
      - uses: actions/checkout@v4

      - name: Image bauen
        run: docker build --target standalone --build-arg BUILD_VERSION=ci -t steinapi-test steinapi-addon

      # Die API-URLs zeigen auf einen geschlossenen lokalen Port: der Test
      # spricht nie mit den echten Diensten von Divera oder Stein.app.
      - name: Container starten
        run: |
          docker run -d --name steinapi -p 127.0.0.1:8099:8099 \
            -e DIVERA_BASE_URL=https://127.0.0.1:9 \
            -e STEIN_BASE_URL=https://127.0.0.1:9 \
            steinapi-test
          for i in $(seq 1 60); do
            if curl -fsS "$API?action=health" >/dev/null 2>&1; then
              echo "bereit nach $((i * 2)) Sekunden"
              exit 0
            fi
            sleep 2
          done
          echo "Container wurde nicht bereit"
          exit 1

      - name: nginx- und php-fpm-Konfiguration
        run: |
          docker exec steinapi nginx -t
          docker exec steinapi php-fpm -t

      # Voraussetzungen der Lücken aus dem PHP-Sicherheitsrelease vom 19.11.2026
      # dürfen im Image nicht erfüllt sein, unabhängig von der PHP-Version.
      - name: Zwischenlösungen für die PHP-Lücken sind gesetzt
        run: |
          # CVE-2026-129291: catch_workers_output muss aus sein
          docker exec steinapi php-fpm -tt 2>&1 | grep -E 'catch_workers_output = no'
          # CVE-2026-129289: nginx hält die Verbindung zu php-fpm nicht offen
          if docker exec steinapi nginx -T 2>/dev/null | grep -E 'fastcgi_keep_conn\s+on'; then exit 1; fi
          # CVE-2026-129496: PHP schreibt Fehler nicht in eine Datei
          test -z "$(docker exec steinapi php -r 'echo ini_get("error_log");')"
          if docker exec steinapi php-fpm -tt 2>&1 | grep -F 'php_admin_value[error_log]'; then exit 1; fi
          # CVE-2026-129292: keine Statusseite von php-fpm
          if docker exec steinapi php-fpm -tt 2>&1 | grep -E 'pm\.status_path = /'; then exit 1; fi
          # Session, DOM, Phar, SOAP und php-cgi sind nicht im Image
          docker exec steinapi php -m | tr 'A-Z' 'a-z' > modules.txt
          cat modules.txt | tr '\n' ' '
          for m in session dom phar soap; do
            if grep -qx "$m" modules.txt; then echo "Erweiterung $m ist installiert"; exit 1; fi
          done
          if docker exec steinapi sh -c 'command -v php-cgi84 || command -v php-cgi'; then exit 1; fi

      - name: Endpunkte antworten
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          test "$(code "$API?action=health")" = 200
          test "$(code "$API?action=stats")" = 200
          test "$(code "$API?action=logs&limit=10")" = 200
          test "$(code "$API?action=config")" = 200
          test "$(code "http://127.0.0.1:8099/")" = 200
          # gesperrt bzw. entfernt
          test "$(code "http://127.0.0.1:8099/config/config.php")" = 404
          test "$(code "http://127.0.0.1:8099/install.sql")" = 404
          test "$(code "$API?action=fieldConfig")" = 404
          test "$(code "$API?action=rawStein")" = 403

      # Ohne erreichbare APIs endet der Lauf mit einem Fehler im Ergebnis. Er
      # durchläuft dabei Sperre, Protokoll und Verlauf gegen die echte MariaDB.
      - name: Sync-Lauf gegen die echte Datenbank
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"source":"ci"}' "$API?action=sync" | tee sync.json
          jq -e '.success == true and .data.busy == false and .data.success == false and .data.errors == 1' sync.json
          curl -fsS "$API?action=stats" | tee stats.json
          # Genau EIN Fehler für einen fehlgeschlagenen Lauf, kein automatischer
          # Lauf bisher, also noch keine Angabe zum nächsten.
          jq -e '.success == true and .data.last_sync != null and .data.synced_today == 0 and .data.errors_24h == 1 and .data.next_sync == null' stats.json
          curl -fsS "$API?action=logs&limit=50" | tee logs.json | jq -e '[.data.logs[].message] | any(startswith("Sync failed"))'
          # Routine-Meldungen stehen auf debug und fehlen bei log_level info
          jq -e '[.data.logs[].message] | any(startswith("Fetching") or . == "Indexed assets" or . == "Fetched data") | not' logs.json

      # Die Sync-Regeln noch einmal, diesmal mit der echten Database-Klasse gegen
      # die MariaDB im Container: Sync-Stand lesen und schreiben, Tabelle
      # anlegen, Sperre halten.
      - name: Sync-Simulation gegen die echte Datenbank
        run: |
          docker cp tests steinapi:/tmp/tests
          docker exec \
            -e STEINAPI_REAL_DB=1 \
            -e STEINAPI_SRC=/var/www/html/src \
            -e STEINAPI_CONFIG=/var/www/html/config/config.php \
            steinapi php /tmp/tests/sync_simulation.php

      - name: Meldungen erscheinen in der Container-Ausgabe
        run: |
          docker logs steinapi > container.log 2>&1
          grep -F '[CRON] SteinAPI Cron Service gestartet' container.log
          grep -E 'ready to handle connections' container.log

      - name: Zugriffsbeschränkung (allow_direct_access=false)
        run: |
          docker rm -f steinapi
          docker run -d --name steinapi -p 127.0.0.1:8099:8099 \
            -e ALLOW_DIRECT_ACCESS=false \
            -e DIVERA_BASE_URL=https://127.0.0.1:9 \
            -e STEIN_BASE_URL=https://127.0.0.1:9 \
            steinapi-test
          for i in $(seq 1 60); do
            if docker exec steinapi curl -fsS "http://127.0.0.1:8099/api.php?action=health" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          # aus dem Container selbst (Cron, Healthcheck): erlaubt
          docker exec steinapi curl -fsS "http://127.0.0.1:8099/api.php?action=health"
          # von außen über den veröffentlichten Port: abgelehnt
          code() { curl -s -o /dev/null -w '%{http_code}' "$1"; }
          test "$(code "$API?action=health")" = 403
          test "$(code "http://127.0.0.1:8099/")" = 403
          # die Ablehnung steht in der Container-Ausgabe
          sleep 1
          docker logs steinapi 2>&1 | grep -F 'access forbidden by rule'

      - name: Container-Protokoll
        if: always()
        run: docker logs steinapi 2>&1 | tail -n 80

  # Das Image, das Home Assistant baut: Standardziel des Dockerfiles auf dem
  # Basis-Image des Supervisors, gestartet wie im Add-on über s6 und mit einer
  # options.json unter /data.
  addon:
    name: Add-on-Image bauen und starten (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # nativer ARM-Rechner von GitHub, kein Emulator
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Basis-Image aus build.yaml lesen
        run: |
          BASE=$(sed -n 's/^ *${{ matrix.arch }}: *//p' steinapi-addon/build.yaml)
          test -n "$BASE"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "Basis-Image: $BASE"

      - name: Image bauen
        run: |
          docker build \
            --build-arg BUILD_FROM="$BASE" \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            --build-arg BUILD_VERSION=ci \
            -t steinapi-addon-test steinapi-addon

      - name: Add-on starten
        run: |
          mkdir -p ci-data
          echo '{"divera_base_url":"https://127.0.0.1:9","stein_base_url":"https://127.0.0.1:9"}' > ci-data/options.json
          docker run -d --name addon -p 127.0.0.1:8099:8099 -v "$PWD/ci-data:/data" steinapi-addon-test
          for i in $(seq 1 60); do
            if docker exec addon curl -fsS "http://127.0.0.1:8099/api.php?action=health" >/dev/null 2>&1; then
              echo "bereit nach $((i * 2)) Sekunden"
              exit 0
            fi
            sleep 2
          done
          echo "Add-on wurde nicht bereit"
          docker logs addon 2>&1 | tail -n 80
          exit 1

      - name: Konfiguration und Zugriff
        run: |
          docker exec addon nginx -t
          docker exec addon php-fpm -t
          # Version aus dem Build-Argument landet in Datei und Label
          test "$(docker exec addon cat /etc/steinapi-version)" = ci
          test "$(docker inspect -f '{{ index .Config.Labels "io.hass.version" }}' steinapi-addon-test)" = ci
          docker exec addon curl -fsS "http://127.0.0.1:8099/api.php?action=stats"
          docker exec addon php -r 'echo "PHP ", PHP_VERSION, " auf ", php_uname("m"), PHP_EOL;'
          # Sync-Lauf nutzt curl und pdo_mysql. Ohne erreichbare APIs endet er mit
          # einem Fehler im Ergebnis, die Anfrage selbst muss aber gelingen.
          docker exec addon curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"source":"ci"}' "http://127.0.0.1:8099/api.php?action=sync" \
            | tee sync.json | jq -e '.success == true and .data.busy == false'
          # Standard im Add-on: nur Ingress und localhost. Von außen 403.
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099/api.php?action=health")" = 403

      - name: Meldungen erscheinen in der Container-Ausgabe
        run: |
          sleep 1
          docker logs addon > addon.log 2>&1
          grep -F 'Version: ci' addon.log
          # supervisord startet ohne CRIT-Meldung
          if grep -F ' CRIT ' addon.log; then
            echo "unerwartete CRIT-Meldung beim Start"
            exit 1
          fi
          grep -F 'Zugriff: nur Home Assistant Ingress' addon.log
          grep -F '[CRON] SteinAPI Cron Service gestartet' addon.log
          grep -E 'ready to handle connections' addon.log
          grep -F 'access forbidden by rule' addon.log

      - name: Container-Protokoll
        if: always()
        run: docker logs addon 2>&1 | tail -n 80
